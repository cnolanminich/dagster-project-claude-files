[project]
name = "dagster-dask-lineage"
version = "0.1.0"
description = "Dagster project demonstrating dagster-dask integration with column schema and lineage tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "dagster-dask>=0.25.0",
    "dask[dataframe]>=2024.1.0",
    "distributed>=2024.1.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.dagster]
module_name = "dagster_dask_lineage.definitions"
code_location_name = "dagster_dask_lineage"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
