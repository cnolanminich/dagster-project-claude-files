[project]
name = "dagster-performance-profiler"
version = "0.1.0"
description = "A Dagster project for profiling memory and CPU overhead of jobs and tasks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dagster>=1.6.0",
    "dagster-webserver>=1.6.0",
    "memray>=1.12.0",
    "psutil>=5.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.dagster]
module_name = "dagster_profiler"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
