[project]
name = "dagster_data_quality_demo"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "azure-functions>=1.24.0",
    "azure-identity>=1.25.1",
    "dagster==1.12.11",
    "dagster-dbt>=0.28.11",
    "dagster-fivetran>=0.28.11",
    "dagster-snowflake>=0.28.11",
    "dbt-snowflake>=1.11.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_data_quality_demo"
registry_modules = [
    "dagster_data_quality_demo.components.*",
]


